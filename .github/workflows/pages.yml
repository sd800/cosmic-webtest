name: Deploy Cosmic WebTest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: python3 prepare-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
